<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .login-main{
            height: 100vh;
            width: 100%;
            background-image: url(WhatsApp\ Image\ 2026-10-03\ at\ 1.53.43\ PM.jpeg);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box{
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color:rgba(243, 232, 232, 0.502) ;
            border-radius:20px ;
             padding: 20px;

        }
        .login-box h2{
            margin-top: 40px;
            margin-bottom: 30px;
            font-size: 30px;
        }
        .login-box input:not([type="checkbox"]){
            padding: 20px 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.406);
        }
        .login-box button{
            width:300px ;
            padding: 15px;
            border-radius: 5px;
            background-color: teal;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 25px;
            margin-bottom: 10px;
        }
        .login-box a{
            text-decoration: none;
            margin-left: 20px;
            
        }
    </style>
</head>
<body>
   <div class="login-main">
        <div class="login-box">
            <h2>Account Login</h2>
            <input type="text" placeholder="User Name"> 
            <input type="password" placeholder="Password"> 
            <button>LOGIN</button>
             <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox" style="font-size: 15px;">Remember me</label>
            <a href="#">Forgot Password?</a>
        </div>
        </div>
       
   </div>
</body>
</html>
